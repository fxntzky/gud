name: GUD weekly ML retraining
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    env:
      GUD_BASE_URL: ${{ secrets.GUD_BASE_URL }}
      GUD_ADMIN_PASSWORD: ${{ secrets.GUD_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check private export configuration
        id: config
        run: |
          if [ -n "$GUD_BASE_URL" ] && [ -n "$GUD_ADMIN_PASSWORD" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Configure GUD_BASE_URL and GUD_ADMIN_PASSWORD in GitHub Secrets.'
          fi
      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Export only human-reviewed labels
        if: steps.config.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error --retry 2 \
            --user "admin:${GUD_ADMIN_PASSWORD}" \
            "${GUD_BASE_URL%/}/api/training-export" \
            --output data/training/validated.jsonl
      - name: Train candidate model
        if: steps.config.outputs.enabled == 'true'
        run: |
          python -m pip install --disable-pip-version-check scikit-learn==1.8.0
          python scripts/train_ml.py
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: '22'
      - name: Run regression tests
        if: steps.config.outputs.enabled == 'true'
        run: node --test tests/*.test.js
      - name: Update portable model only when changed
        if: steps.config.outputs.enabled == 'true'
        run: |
          git config user.name 'gud-learning-bot'
          git config user.email 'gud-learning-bot@users.noreply.github.com'
          git add server/classification/model.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ml): train from verified editorial feedback'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
